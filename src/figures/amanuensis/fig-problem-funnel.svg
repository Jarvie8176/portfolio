<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 452" width="370" height="452" role="img" aria-labelledby="t2 d2">
  <title id="t2">What arrives</title>
  <desc id="d2">Six kinds of source converge into one ranked stream, and each item leaves as one structured record.</desc>
  <style>
    .mono{font-family:'Noto Sans Mono',ui-monospace,monospace}
    .sans{font-family:'Noto Sans',system-ui,sans-serif}
    .lbl{font-size:10.5px;font-weight:600;letter-spacing:1.5px;fill:#8a8f92}
    .chip{font-size:11.5px;fill:#5a5e63}
    .arw{font-size:17px;fill:#8a8f92}
    .stream{font-size:13px;font-weight:600;fill:#ffffff;letter-spacing:0.3px}
    .fk{font-size:11.5px;fill:#8a8f92}
    .fv{font-size:11.5px;fill:#5a5e63}
    .fn{font-size:10px;fill:#8a8f92}
  </style>

  <text class="mono lbl" x="0" y="9">WHAT ARRIVES</text>

  <rect x="0" y="24" width="117" height="28" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono chip" x="58.5" y="42" text-anchor="middle">work email</text>
  <rect x="126.5" y="24" width="117" height="28" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono chip" x="185" y="42" text-anchor="middle">newsletters</text>
  <rect x="253" y="24" width="117" height="28" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono chip" x="311.5" y="42" text-anchor="middle">to-dos</text>
  <rect x="0" y="59" width="117" height="28" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono chip" x="58.5" y="77" text-anchor="middle">notes</text>
  <rect x="126.5" y="59" width="117" height="28" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono chip" x="185" y="77" text-anchor="middle">calendar</text>
  <rect x="253" y="59" width="117" height="28" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono chip" x="311.5" y="77" text-anchor="middle">social feeds</text>

  <text class="sans arw" x="31" y="112" text-anchor="middle">↘</text>
  <text class="sans arw" x="93" y="112" text-anchor="middle">↘</text>
  <text class="sans arw" x="155" y="112" text-anchor="middle">↓</text>
  <text class="sans arw" x="216" y="112" text-anchor="middle">↓</text>
  <text class="sans arw" x="278" y="112" text-anchor="middle">↙</text>
  <text class="sans arw" x="340" y="112" text-anchor="middle">↙</text>

  <rect x="0" y="124" width="370" height="38" fill="#2c4e8a" stroke="#2c4e8a" stroke-width="2"/>
  <text class="mono stream" x="185" y="148" text-anchor="middle">one ranked stream</text>

  <text class="sans arw" x="185" y="188" text-anchor="middle">↓</text>

  <rect x="0" y="200" width="370" height="196" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono lbl" x="14" y="222">ONE STRUCTURED RECORD</text>
  <text class="mono fk" x="14" y="248">id</text>
  <text class="mono fv" x="118" y="248">itm_9f2c41</text>
  <text class="mono fk" x="14" y="272">source</text>
  <text class="mono fv" x="118" y="272">newsletter-feed</text>
  <text class="mono fk" x="14" y="296">priority</text>
  <text class="mono fv" x="118" y="296" fill="#2c4e8a" font-weight="600">should</text>
  <text class="mono fk" x="14" y="320">sensitivity</text>
  <text class="mono fv" x="118" y="320" fill="#985e49" font-weight="600">high</text>
  <text class="mono fk" x="14" y="344">audience</text>
  <text class="mono fv" x="118" y="344">personal</text>
  <text class="mono fk" x="14" y="368">summary</text>
  <text class="mono fv" x="118" y="368">one line, written by the model</text>

  <text class="mono fn" x="0" y="418">Every source lands in the same shape, so items from</text>
  <text class="mono fn" x="0" y="433">different apps can finally be ranked against each other.</text>
</svg>
