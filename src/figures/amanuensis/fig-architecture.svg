<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 356" width="1040" height="356" role="img" aria-labelledby="t3 d3">
  <title id="t3">Three-stage architecture</title>
  <desc id="d3">Ingest-kit normalizes a source item, triage-kit makes a context-ranked decision, and push-kit selects immediate delivery, the digest window, or an ambient hold. Policy gates control inference and delivery. Each stage writes to its own store: content-hashed records, verdicts versioned by route, and an idempotent delivery ledger. A stable item ID connects the complete trace.</desc>
  <defs>
    <marker id="arch-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2c4e8a"/>
    </marker>
    <marker id="arch-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#985e49"/>
    </marker>
  </defs>
  <style>
    .mono{font-family:'Noto Sans Mono',ui-monospace,monospace}
    .label{font-size:10px;font-weight:700;letter-spacing:1.4px;fill:#8a8f92}
    .kit{font-size:15px;font-weight:700;fill:#1b1d1f}
    .purpose{font-size:11px;fill:#5a5e63}
    .tag{font-size:10px;font-weight:600;fill:#2c4e8a}
    .policy{font-size:10px;font-weight:700;letter-spacing:1px;fill:#985e49}
    .trace{font-size:10.5px;font-weight:700;letter-spacing:1px;fill:#657052}
    .store text{font-size:9.5px;font-weight:600;letter-spacing:0.6px;fill:#5a5e63}
    .inverse{fill:#fff}
    .icon{fill:none;stroke:#2c4e8a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <text class="mono label" x="0" y="12">PRIVATE CONTEXT AND POLICY ENTER AT EXPLICIT BOUNDARIES</text>
  <rect x="396" y="24" width="210" height="30" fill="#f7eee9" stroke="#985e49" stroke-dasharray="4 3"/>
  <text class="mono policy" x="501" y="43" text-anchor="middle">INBOUND POLICY</text>
  <rect x="790" y="24" width="210" height="30" fill="#f7eee9" stroke="#985e49" stroke-dasharray="4 3"/>
  <text class="mono policy" x="895" y="43" text-anchor="middle">OUTBOUND POLICY</text>
  <path d="M501 54v24" stroke="#985e49" stroke-width="1.5" marker-end="url(#arch-red)"/>
  <path d="M895 54v24" stroke="#985e49" stroke-width="1.5" marker-end="url(#arch-red)"/>

  <rect x="0" y="84" width="280" height="156" fill="#f6f7f5" stroke="#dce1de"/>
  <rect x="0" y="84" width="5" height="156" fill="#2c4e8a"/>
  <g class="icon" transform="translate(24 108)">
    <path d="M2 2h30v22H2zM2 3l15 11L32 3"/>
  </g>
  <text class="mono kit" x="76" y="119">ingest-kit</text>
  <text class="mono purpose" x="76" y="139">make sources comparable</text>
  <rect x="24" y="177" width="70" height="28" fill="#eef2f8"/>
  <text class="mono tag" x="59" y="195" text-anchor="middle">NORMALIZE</text>
  <rect x="104" y="177" width="70" height="28" fill="#eef2f8"/>
  <text class="mono tag" x="139" y="195" text-anchor="middle">DEDUPE</text>
  <rect x="184" y="177" width="72" height="28" fill="#eef2f8"/>
  <text class="mono tag" x="220" y="195" text-anchor="middle">IDENTIFY</text>

  <path d="M290 162h70" stroke="#2c4e8a" stroke-width="1.8" marker-end="url(#arch-blue)"/>
  <rect x="324" y="151" width="22" height="22" transform="rotate(45 335 162)" fill="#f7eee9" stroke="#985e49"/>

  <rect x="380" y="84" width="280" height="156" fill="#eef2f8" stroke="#2c4e8a"/>
  <rect x="380" y="84" width="5" height="156" fill="#2c4e8a"/>
  <g class="icon" transform="translate(404 106)">
    <path d="M4 2v27M17 2v27M30 2v27M0 9h8M13 20h8M26 13h8"/>
  </g>
  <text class="mono kit" x="456" y="119">triage-kit</text>
  <text class="mono purpose" x="456" y="139">turn context into a decision</text>
  <rect x="404" y="177" width="70" height="28" fill="#fff"/>
  <text class="mono tag" x="439" y="195" text-anchor="middle">PRIORITY</text>
  <rect x="484" y="177" width="76" height="28" fill="#fff"/>
  <text class="mono tag" x="522" y="195" text-anchor="middle">AUDIENCE</text>
  <rect x="570" y="177" width="66" height="28" fill="#fff"/>
  <text class="mono tag" x="603" y="195" text-anchor="middle">INTENT</text>

  <path d="M670 162h70" stroke="#2c4e8a" stroke-width="1.8" marker-end="url(#arch-blue)"/>
  <rect x="704" y="151" width="22" height="22" transform="rotate(45 715 162)" fill="#f7eee9" stroke="#985e49"/>

  <rect x="760" y="84" width="280" height="156" fill="#f6f7f5" stroke="#dce1de"/>
  <rect x="760" y="84" width="5" height="156" fill="#2c4e8a"/>
  <g class="icon" transform="translate(784 108)">
    <path d="M2 3l32 13-32 13 6-13-6-13zM8 16h14"/>
  </g>
  <text class="mono kit" x="836" y="119">push-kit</text>
  <text class="mono purpose" x="836" y="139">spend attention deliberately</text>
  <rect x="784" y="177" width="84" height="28" fill="#2c4e8a"/>
  <text class="mono tag inverse" x="826" y="195" text-anchor="middle">IMMEDIATE</text>
  <rect x="872" y="177" width="64" height="28" fill="#eef2f8"/>
  <text class="mono tag" x="904" y="195" text-anchor="middle">DIGEST</text>
  <rect x="940" y="177" width="76" height="28" fill="#fff" stroke="#dce1de"/>
  <text class="mono tag" x="978" y="195" text-anchor="middle">AMBIENT</text>

  <path d="M140 240v16M520 240v16M900 240v16" stroke="#9ca6a0" stroke-width="1.5"/>
  <g class="mono store">
    <rect x="24" y="256" width="232" height="34" fill="#fbfaf7" stroke="#9ca6a0"/>
    <path d="M24 262h232" stroke="#9ca6a0"/>
    <text x="140" y="278" text-anchor="middle">RECORD STORE · CONTENT-HASHED</text>
    <rect x="404" y="256" width="232" height="34" fill="#fbfaf7" stroke="#9ca6a0"/>
    <path d="M404 262h232" stroke="#9ca6a0"/>
    <text x="520" y="278" text-anchor="middle">VERDICTS · VERSIONED BY ROUTE</text>
    <rect x="784" y="256" width="232" height="34" fill="#fbfaf7" stroke="#9ca6a0"/>
    <path d="M784 262h232" stroke="#9ca6a0"/>
    <text x="900" y="278" text-anchor="middle">DELIVERY LEDGER · IDEMPOTENT</text>
  </g>

  <path d="M0 322H1040" stroke="#657052" stroke-width="2"/>
  <circle cx="140" cy="322" r="5" fill="#657052"/>
  <circle cx="520" cy="322" r="5" fill="#657052"/>
  <circle cx="900" cy="322" r="5" fill="#657052"/>
  <text class="mono trace" x="520" y="342" text-anchor="middle">STABLE ITEM ID CONNECTS THE COMPLETE TRACE</text>

</svg>
