<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 524" width="1040" height="524" role="img" aria-labelledby="t3 d3">
  <title id="t3">How it works</title>
  <desc id="d3">Sources feed ingest-kit, triage-kit and push-kit in one direction, out to channels. Policy is injected from outside; three stores back a rebuildable read model; feedback returns to triage.</desc>
  <style>
    .mono{font-family:'Noto Sans Mono',ui-monospace,monospace}
    .sans{font-family:'Noto Sans',system-ui,sans-serif}
    .kit{font-size:12.5px;font-weight:700;fill:#2c4e8a}
    .edge{font-size:12px;font-weight:600;fill:#5a5e63}
    .body{font-size:11.5px;fill:#5a5e63}
    .mut{font-size:11.5px;fill:#8a8f92}
    .tiny{font-size:10px;fill:#8a8f92}
    .gk{font-size:9.5px;font-weight:600;letter-spacing:0.8px;fill:#985e49}
    .gt{font-size:11px;fill:#5a5e63}
    .pk{font-size:11px;font-weight:600;fill:#985e49}
    .pt{font-size:12.5px;fill:#5a5e63}
    .sk{font-size:11px;font-weight:600;fill:#657052}
    .st{font-size:12px;fill:#8a8f92}
    .arrow{font-size:13px;font-weight:700;fill:#2c4e8a}
  </style>

  <rect x="0" y="0" width="1040" height="66" fill="#f7eee9" stroke="#985e49" stroke-dasharray="4 3"/>
  <text class="mono pk" x="16" y="22">private policy pack</text>
  <text class="sans pt" x="16" y="42">The rules that encode what is sensitive and who may see it arrive from outside, by config.</text>
  <text class="sans pt" x="16" y="58">No kit carries them, and none of them is in the published source.</text>

  <path d="M520 70 L520 88" stroke="#985e49" stroke-width="1.5" marker-end="url(#ao)"/>
  <path d="M745 70 L745 88" stroke="#985e49" stroke-width="1.5" marker-end="url(#ao)"/>
  <defs>
    <marker id="ao" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#985e49"/>
    </marker>
    <marker id="ab" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#2c4e8a"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#657052"/>
    </marker>
  </defs>

  <rect x="0" y="94" width="171" height="200" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono edge" x="14" y="116">sources</text>
  <text class="sans mut" x="14" y="138">mail · newsletters ·</text>
  <text class="sans mut" x="14" y="155">to-dos · notes ·</text>
  <text class="sans mut" x="14" y="172">calendar · feeds</text>
  <text class="mono tiny" x="14" y="198">one adapter each</text>

  <path d="M178 194 L186 194" stroke="#2c4e8a" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="193" y="94" width="203" height="200" fill="#eef2f8" stroke="#2c4e8a" stroke-width="2"/>
  <text class="mono kit" x="207" y="117">ingest-kit</text>
  <text class="sans body" x="207" y="140">Normalizes each source</text>
  <text class="sans body" x="207" y="157">into one record shape,</text>
  <text class="sans body" x="207" y="174">deduped on the way in,</text>
  <text class="sans body" x="207" y="191">resumable from an</text>
  <text class="sans body" x="207" y="208">opaque cursor.</text>

  <path d="M403 194 L411 194" stroke="#2c4e8a" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="418" y="94" width="203" height="200" fill="#eef2f8" stroke="#2c4e8a" stroke-width="2"/>
  <text class="mono kit" x="432" y="117">triage-kit</text>
  <text class="sans body" x="432" y="140">One model call per item</text>
  <text class="sans body" x="432" y="157">returns priority,</text>
  <text class="sans body" x="432" y="174">audience, and a summary.</text>
  <rect x="432" y="192" width="175" height="62" fill="#f7eee9"/>
  <rect x="432" y="192" width="3" height="62" fill="#985e49"/>
  <text class="mono gk" x="443" y="209">GATE 1 · IN</text>
  <text class="sans gt" x="443" y="227">sensitive items go to a</text>
  <text class="sans gt" x="443" y="243">local model, or nowhere</text>

  <path d="M628 194 L636 194" stroke="#2c4e8a" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="644" y="94" width="203" height="200" fill="#eef2f8" stroke="#2c4e8a" stroke-width="2"/>
  <text class="mono kit" x="658" y="117">push-kit</text>
  <text class="sans body" x="658" y="140">Routes by priority and</text>
  <text class="sans body" x="658" y="157">audience, folds into</text>
  <text class="sans body" x="658" y="174">digest windows, records</text>
  <text class="sans body" x="658" y="191">every attempt.</text>
  <rect x="658" y="206" width="175" height="62" fill="#f7eee9"/>
  <rect x="658" y="206" width="3" height="62" fill="#985e49"/>
  <text class="mono gk" x="669" y="223">GATE 2 · OUT ×2</text>
  <text class="sans gt" x="669" y="241">audience must match ·</text>
  <text class="sans gt" x="669" y="257">sensitivity bars the cloud</text>

  <path d="M854 194 L862 194" stroke="#2c4e8a" stroke-width="1.5" marker-end="url(#ab)"/>

  <rect x="869" y="94" width="171" height="200" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono edge" x="883" y="116">channels</text>
  <text class="sans mut" x="883" y="138">a self-hosted room,</text>
  <text class="sans mut" x="883" y="155">a chat bot,</text>
  <text class="sans mut" x="883" y="172">a phone notifier</text>
  <text class="mono tiny" x="883" y="192">each channel declares</text>
  <text class="mono tiny" x="883" y="206">the audience it serves</text>

  <path d="M294 296 L294 306" stroke="#657052" stroke-width="1.2" marker-end="url(#ag)"/>
  <path d="M520 296 L520 306" stroke="#657052" stroke-width="1.2" marker-end="url(#ag)"/>
  <path d="M745 296 L745 306" stroke="#657052" stroke-width="1.2" marker-end="url(#ag)"/>

  <rect x="193" y="310" width="203" height="30" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono sk" x="294" y="330" text-anchor="middle">items</text>
  <rect x="418" y="310" width="203" height="30" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono sk" x="520" y="330" text-anchor="middle">verdicts</text>
  <rect x="644" y="310" width="203" height="30" fill="#f6f7f5" stroke="#dce1de"/>
  <text class="mono sk" x="745" y="330" text-anchor="middle">deliveries</text>

  <rect x="0" y="352" width="1040" height="58" fill="#f6f7f5" stroke="#dce1de"/>
  <rect x="0" y="352" width="4" height="58" fill="#657052"/>
  <text class="mono sk" x="18" y="374">read model</text>
  <text class="sans st" x="18" y="396">A projection over those three stores. It holds no truth of its own and can be rebuilt from scratch.</text>

  <rect x="0" y="420" width="1040" height="62" fill="#f6f7f5" stroke="#9ca6a0" stroke-dasharray="4 3"/>
  <path d="M40 451 L18 451" stroke="#657052" stroke-width="1.5" marker-end="url(#ag)"/>
  <text class="mono sk" x="52" y="442">feedback returns to triage</text>
  <text class="sans st" x="52" y="462">Scores on delivered items become rule changes a human approves, then a deterministic step writes</text>
  <text class="sans st" x="52" y="476">them back. The model is never asked to remember a preference.</text>

  <text class="mono tiny" x="0" y="508">timers drive every stage - no always-hot daemon</text>
  <text class="mono tiny" x="330" y="508">three refusal points: one on the way in, two in front of every send</text>
  <text class="mono tiny" x="810" y="508">no kit imports another</text>
</svg>
