<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 224" width="1040" height="224" role="img" aria-labelledby="tw dw">
  <title id="tw">The judgment layer</title>
  <desc id="dw">Mail, tasks, feeds, and calendar items can already be moved or shortened. Amanuensis compares them against shared context and makes the delivery call before anything interrupts: immediate delivery, the digest window, or a quiet hold.</desc>
  <defs>
    <marker id="why-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2c4e8a"/>
    </marker>
  </defs>
  <style>
    .mono{font-family:'Noto Sans Mono',ui-monospace,monospace}
    .label{font-size:10px;font-weight:700;letter-spacing:1.4px;fill:#8a8f92}
    .source{font-size:11px;font-weight:600;fill:#5a5e63}
    .step{font-size:13px;font-weight:700;fill:#1b1d1f}
    .sub{font-size:10.5px;fill:#5a5e63}
    .out{font-size:10.5px;font-weight:700;letter-spacing:.6px;fill:#2c4e8a}
    .inverse{fill:#fff}
    .icon{fill:none;stroke:#2c4e8a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <text class="mono label" x="0" y="12">WHAT ALREADY EXISTS</text>
  <g transform="translate(0 30)">
    <rect width="220" height="48" fill="#f6f7f5" stroke="#dce1de"/>
    <path class="icon" d="M16 14h22v16H16zM16 15l11 8 11-8"/>
    <text class="mono source" x="54" y="29">mail</text>
    <rect y="58" width="220" height="48" fill="#f6f7f5" stroke="#dce1de"/>
    <path class="icon" d="M17 74h20M17 82h20M17 90h13"/>
    <text class="mono source" x="54" y="87">tasks + notes</text>
    <rect y="116" width="220" height="48" fill="#f6f7f5" stroke="#dce1de"/>
    <path class="icon" d="M17 132h20v16H17zM21 128v7M33 128v7"/>
    <text class="mono source" x="54" y="145">feeds + calendar</text>
  </g>

  <path d="M232 112h54" stroke="#2c4e8a" stroke-width="1.6" marker-end="url(#why-arrow)"/>
  <g transform="translate(302 52)">
    <rect width="160" height="54" fill="#fbfaf7" stroke="#dce1de"/>
    <path class="icon" d="M18 16h24M34 10l8 6-8 6"/>
    <text class="mono step" x="58" y="25">move</text>
    <text class="mono sub" x="58" y="41">urgent or not</text>
    <rect y="68" width="160" height="54" fill="#fbfaf7" stroke="#dce1de"/>
    <path class="icon" d="M18 84h24M18 91h17M18 98h10"/>
    <text class="mono step" x="58" y="93">shorten</text>
    <text class="mono sub" x="58" y="109">each item alone</text>
  </g>

  <path d="M474 112h54" stroke="#2c4e8a" stroke-width="1.6" marker-end="url(#why-arrow)"/>
  <g transform="translate(544 30)">
    <rect width="270" height="164" fill="#eef2f8" stroke="#2c4e8a" stroke-width="2"/>
    <g class="icon" transform="translate(24 30)">
      <path d="M4 0v36M18 0v36M32 0v36M0 10h8M14 26h8M28 17h8"/>
    </g>
    <text class="mono label" x="84" y="38" fill="#2c4e8a">THE MISSING LAYER</text>
    <text class="mono step" x="84" y="68">compare across sources</text>
    <text class="mono sub" x="84" y="91">shared context · timing · intent</text>
    <rect x="24" y="116" width="222" height="26" fill="#fff"/>
    <text class="mono out" x="135" y="133" text-anchor="middle">JUDGMENT BEFORE DELIVERY</text>
  </g>

  <path d="M826 112h46" stroke="#2c4e8a" stroke-width="1.6" marker-end="url(#why-arrow)"/>
  <g transform="translate(888 30)">
    <rect width="152" height="44" fill="#2c4e8a"/>
    <text class="mono out inverse" x="76" y="27" text-anchor="middle">IMMEDIATE</text>
    <rect y="60" width="152" height="44" fill="#eef2f8" stroke="#2c4e8a"/>
    <text class="mono out" x="76" y="87" text-anchor="middle">DIGEST</text>
    <rect y="120" width="152" height="44" fill="#f6f7f5" stroke="#dce1de"/>
    <text class="mono out" x="76" y="147" text-anchor="middle">QUIET</text>
  </g>

</svg>
