# Build validation only. This workflow deliberately holds no secrets and no
# deploy credentials: deployment is pull-based from the serving side, which
# independently verifies this check succeeded before it ships a commit.
# GitHub-hosted runner on purpose (public repo — fork PRs must never reach
# private infrastructure).
name: ci

on:
  push:
    # dev is the integration branch and is what the preview deploy builds from,
    # so it needs the same check main does: the deploy side requires a green
    # check for the exact sha before it will ship it.
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  # Deliberately a placeholder, not the real media host. The check needs *a*
  # base URL because the gallery build fails closed without one, but this repo
  # is public and its deploy gate requires build output to carry no real
  # domain, so the value here must not be the production one. What this
  # validates is the wiring, not the hostname.
  TRAILWALK_ASSET_BASE_URL: https://assets.example.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The committed design-token CSS must be regenerable byte-clean from the
      # token source, not just consumable — otherwise a hand-edit or a stale
      # commit passes unnoticed.
      - run: npm run tokens:build
      - run: git diff --exit-code src/styles/tokens.generated.css
      # The committed diagram artifacts (Mermaid + doc) must be regenerable
      # byte-clean from the JSON Canvas SoT, and the render/parity gate must
      # pass — otherwise the Canvas can drift from its generated docs, or a
      # render regression can slip in, while checks stay green. This is what
      # makes the "auditable, drift-resistant" claim actually enforced.
      - run: npm run diagram:derive
      - run: npm run diagram:doc
      - run: git diff --exit-code src/diagrams/yaaa.mmd docs/diagrams/yaaa.md src/diagrams/amanuensis-example.mmd docs/diagrams/amanuensis-example.md
      - run: npm run diagram:gate
      - run: npm run build
      - run: test -f dist/index.html
