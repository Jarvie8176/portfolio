# Build validation only. This workflow deliberately holds no secrets and no
# deploy credentials: deployment is pull-based from the serving side, which
# independently verifies this check succeeded before it ships a commit.
# GitHub-hosted runner on purpose (public repo — fork PRs must never reach
# private infrastructure).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Not a secret: this is the public media hostname that already appears in the
  # published HTML. It is set here so the check exercises the same asset wiring
  # production uses. The build fails closed without it, so a green check that
  # omitted it would be validating a broken configuration.
  TRAILWALK_ASSET_BASE_URL: https://media.fnpg.me

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: test -f dist/index.html
